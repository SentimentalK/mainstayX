server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2 application/font-woff2;

  # Hashed build assets (Astro emits them under /_astro/) never change: cache for a year.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Pages are static HTML per route (/blog/ -> /blog/index.html); always revalidate
  # so new deploys show up at once.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
