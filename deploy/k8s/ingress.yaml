# CHANGE ME: host, TLS secret / cert-manager issuer.
# k3s ships Traefik as the default ingress controller; adjust ingressClassName
# if you run something else (e.g. nginx).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mainstayx
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt   # CHANGE ME (if you use cert-manager)
spec:
  ingressClassName: traefik
  rules:
    - host: mainstayx.example.com                    # CHANGE ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mainstayx
                port: { name: http }
  tls:
    - hosts: [mainstayx.example.com]                 # CHANGE ME
      secretName: mainstayx-tls                      # CHANGE ME
