# CHANGE ME: image (registry/name:tag).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainstayx
  labels: { app: mainstayx }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: mainstayx }
  template:
    metadata:
      labels: { app: mainstayx }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: REGISTRY.EXAMPLE.COM/mainstayx:latest   # CHANGE ME
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
