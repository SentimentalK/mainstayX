name: Build & Publish Image

# Mirrors the homelab app repos (tracking-tool, chief-everything-officer):
# PRs build and smoke-test amd64 only; pushes to main publish a multi-arch
# (amd64 + arm64) image to GHCR. The k3s-homelab Deployment pulls
# ghcr.io/sentimentalk/mainstayx:latest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build, Smoke-test & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mainstayx" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile runs `npm run build`, which type-checks (astro check) first.
      - name: Smoke build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: mainstayx:ci
          cache-from: type=gha

      - name: Smoke test container
        run: |
          CONTAINER_ID=$(docker run -d -p 8080:8080 mainstayx:ci)
          trap "docker logs $CONTAINER_ID; docker rm -f $CONTAINER_ID" EXIT

          for i in $(seq 1 15); do
            curl -fs http://localhost:8080/healthz >/dev/null && break
            sleep 1
          done

          check() {
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$1")
            echo "$1 -> $status"
            test "$status" = "$2" || { echo "expected $2"; exit 1; }
          }
          check /healthz 200
          check / 200
          check /projects/ 200
          check /definitely-not-a-page 404
          # Directory redirects must stay relative (no :8080 leaking past Traefik).
          loc=$(curl -sI http://localhost:8080/projects | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          echo "/projects -> $loc"
          case "$loc" in *:8080*) echo "absolute redirect leaks the container port"; exit 1;; esac

          ASSET=$(curl -s http://localhost:8080/ | grep -o '/_astro/[^"]*\.css' | head -n 1)
          test -n "$ASSET" || { echo "no /_astro/ asset referenced from /"; exit 1; }
          check "$ASSET" 200

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short-sha>, latest and main (on main).
      - name: Extract Docker Metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch

      - name: Build and Push Multi-arch Image
        if: github.event_name != 'pull_request'
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print Published Image
        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest: ${{ steps.docker_build.outputs.digest }}"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Roll out: kubectl -n mainstayx rollout restart deployment/mainstayx"
